name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the GITHUB_TOKEN: this workflow only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # sqlx macros check queries against the committed .sqlx/ metadata, not a live DB.
  SQLX_OFFLINE: "true"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: tests (Postgres + Valkey/Redis + S3-compatible store)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: securedrop
          POSTGRES_PASSWORD: securedrop-ci
          POSTGRES_DB: securedrop
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U securedrop" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
      s3:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: securedrop-ci
          RUSTFS_SECRET_KEY: securedrop-ci-secret
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: ":9000"
          RUSTFS_CONSOLE_ENABLE: "false"
        ports: ["59000:9000"]
    env:
      APP_ENV: local
      DATABASE_URL: postgres://securedrop:securedrop-ci@127.0.0.1:55432/securedrop
      REDIS_URL: redis://127.0.0.1:56379/0
      JWT_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      S3_BUCKET: securedrop-ci
      S3_ENDPOINT_URL: http://127.0.0.1:59000
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:59000
      S3_FORCE_PATH_STYLE: "true"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: securedrop-ci
      AWS_SECRET_ACCESS_KEY: securedrop-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Wait for the object store
        run: |
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:59000/health && exit 0; sleep 1; done
          echo "object store did not become ready" && exit 1
      - name: Apply migrations
        run: sqlx migrate run --source crates/api/migrations
      - name: Offline query data is up to date
        # Fails if someone changed a query without re-running `cargo sqlx prepare`.
        run: SQLX_OFFLINE=false cargo sqlx prepare --workspace --check
      - name: Test
        run: cargo test --workspace --locked

  supply-chain:
    name: dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisories (RustSec), licenses, banned crates, and allowed registries in one tool.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  docker:
    name: image build + scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          tags: securedrop-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: securedrop-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    name: terraform validate + IaC scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"
      - run: terraform fmt -recursive -check
      - name: Validate
        run: |
          for dir in bootstrap envs/dev; do
            terraform -chdir=$dir init -backend=false -input=false -lockfile=readonly
            terraform -chdir=$dir validate
          done
      - uses: terraform-linters/setup-tflint@v6
        with:
          github_token: ${{ github.token }}
      - run: tflint --init --config "$PWD/.tflint.hcl"
        env:
          # Authenticated plugin downloads (anonymous GitHub API calls get rate-limited).
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$PWD/.tflint.hcl" --minimum-failure-severity=warning
      - name: Checkov
        run: docker run --rm -v "$PWD:/tf" bridgecrew/checkov:latest -d /tf --framework terraform --quiet --compact
