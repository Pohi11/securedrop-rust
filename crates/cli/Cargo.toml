[package]
name = "securedrop-cli"
description = "Command-line client for SecureDrop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "securedrop"
path = "src/main.rs"

[dependencies]
securedrop-common.workspace = true

anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
indicatif = "0.18"

[dev-dependencies]
securedrop-api.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tempfile = "3"
axum.workspace = true

[lints]
workspace = true
