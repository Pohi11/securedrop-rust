# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/
#   cargo deny check

[graph]
all-features = false

[advisories]
# Fail on any RustSec advisory (vulnerabilities, unmaintained, unsound) affecting our tree.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only; anything else must be reviewed and added deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0", # Boost: permissive, OSI-approved (xxhash-rust via redis)
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow" # common in large trees (AWS SDK); tracked, not blocked
wildcards = "deny"
allow-wildcard-paths = true
# Nothing should pull in OpenSSL: the whole stack uses rustls / aws-lc-rs.
deny = [{ name = "openssl-sys" }, { name = "openssl" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
